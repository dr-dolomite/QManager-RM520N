# RM520N-GL / RG501Q-EU: one Cortex-A7 core, armv7l hard-float. rust-lld links
# a fully static binary from musl's self-contained CRT objects.
[build]
target = "armv7-unknown-linux-musleabihf"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
